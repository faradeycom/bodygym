<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Body Gym</title>
<meta name="description" content="Body Gym, тренажерний зал у Кривому Розі: заняття для дорослих і дітей, тренери, ціни, години роботи, як нас знайти.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E6EAE9; --surface:#FFFFFF; --surface2:#F2F4F4; --ink:#14181B; --muted:#5A646A; --line:#D1D7D6;
  --accent:#1D53D1; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --ok:#23864F; --ok-soft:#E1F2E8; --warn:#B87A00; --warn-soft:#FBF0D6;
  --band:#14181B; --band-ink:#E6EAE9; --band-muted:#9AA4AA; --band-line:#2B3237;
  --z1:#1D53D1; --z2:#5B80DC; --z3:#93AAE6; --z4:#14181B; --z5:#5A646A; --z6:#A3ACB0; --z7:#C9CFCF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1013; --surface:#161A1E; --surface2:#1D2227; --ink:#E7EBED; --muted:#96A0A6; --line:#2A3137;
    --accent:#6A93FF; --accent-ink:#0A0F1C; --accent-soft:#1A2440;
    --ok:#4CC282; --ok-soft:#15291E; --warn:#E3AE3A; --warn-soft:#2D2413;
    --band:#1D2227; --band-ink:#E7EBED; --band-muted:#96A0A6; --band-line:#343C43;
    --z1:#6A93FF; --z2:#4A6FCC; --z3:#34508F; --z4:#E7EBED; --z5:#96A0A6; --z6:#5E686E; --z7:#3A4248;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1013; --surface:#161A1E; --surface2:#1D2227; --ink:#E7EBED; --muted:#96A0A6; --line:#2A3137;
  --accent:#6A93FF; --accent-ink:#0A0F1C; --accent-soft:#1A2440;
  --ok:#4CC282; --ok-soft:#15291E; --warn:#E3AE3A; --warn-soft:#2D2413;
  --band:#1D2227; --band-ink:#E7EBED; --band-muted:#96A0A6; --band-line:#343C43;
  --z1:#6A93FF; --z2:#4A6FCC; --z3:#34508F; --z4:#E7EBED; --z5:#96A0A6; --z6:#5E686E; --z7:#3A4248;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.05em;line-height:1;text-decoration:none;color:var(--ink)}
nav.links{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.links::-webkit-scrollbar{display:none}
nav.links a{flex:none;text-decoration:none;color:var(--muted);font:600 13px var(--body);letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;border-radius:6px}
nav.links a:hover{color:var(--ink);background:var(--surface2)}
.seg{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 12px var(--body);padding:6px 9px;cursor:pointer;letter-spacing:.04em}
.seg button.on{background:var(--ink);color:var(--bg)}
.demo{font-size:13px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-top:16px}

/* type */
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:clamp(46px,8.4vw,92px);text-transform:uppercase}
h2{font-size:clamp(34px,5vw,52px);text-transform:uppercase}
h3{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;line-height:1.1}
.eyebrow{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:18px;max-width:34em;margin:0;color:var(--ink)}
p{margin:0}

section{padding-block:56px;border-top:1px solid var(--line)}
/* section on a photo: always the dark palette, whatever the page theme */
.photosec{color-scheme:dark;border-top:0;
  --ink:#F2F5F7; --muted:#C3CCD2; --line:rgba(255,255,255,.18); --surface:rgba(14,18,22,.62); --surface2:rgba(14,18,22,.5);
  --accent:#8FB0FF; --accent-soft:rgba(106,147,255,.2);
  --z1:#6A93FF; --z2:#4A6FCC; --z3:#34508F; --z4:#E7EBED; --z5:#96A0A6; --z6:#5E686E; --z7:#3A4248;
  color:var(--ink);background-color:#0E1216;
  background-image:linear-gradient(180deg,rgba(10,13,17,.7) 0%,rgba(10,13,17,.5) 45%,rgba(10,13,17,.62) 100%),url("img/about.jpg");
  background-size:cover;background-position:center}
.photosec .sec-head,.photosec .total,.photosec .legend{text-shadow:0 1px 3px rgba(0,0,0,.7)}
.photosec .am{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.photosec .areabar{background:transparent}
.sec-head{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;max-width:44em}
.sec-head p{color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px var(--body);border-radius:8px;padding:11px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:13px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* hero */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:32px;align-items:end;padding-block:40px 56px}
.hero-l{display:flex;flex-direction:column;gap:22px}
.hero-l h1 em{font-style:normal;color:#8FB0FF}
/* hero photo: always dark overlay, so text colors are fixed light in both themes */
.herobg{margin-top:16px;color:#F2F5F7;background-color:#0E1216;
  background-image:linear-gradient(90deg,rgba(10,13,17,.72) 0%,rgba(10,13,17,.45) 50%,rgba(10,13,17,.08) 100%),url("img/hero.jpg");
  background-size:cover;background-position:center 35%}
.herobg .eyebrow{color:#D5DCE1}
.herobg .hero-l{text-shadow:0 1px 3px rgba(0,0,0,.65),0 0 18px rgba(0,0,0,.45)}
.herobg .lead{color:#E3E8EC}
.herobg .btn:not(.primary){background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35);color:#F2F5F7}
.herobg .btn.primary{background:#2F63E0;border-color:#2F63E0;color:#fff}
.herobg .band{background:rgba(14,18,22,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12)}
.herobg .fact{background:rgba(14,18,22,.6)}
.herobg .facts{background:rgba(255,255,255,.12)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.band{background:var(--band);color:var(--band-ink);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px}
.band .open{display:flex;align-items:center;gap:10px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--band-muted);flex:none}
.dot.on{background:#3FBF77;box-shadow:0 0 0 4px rgba(63,191,119,.2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--band-line);border-radius:10px;overflow:hidden}
.fact{background:var(--band);padding:14px 12px}
.fact b{display:block;font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.fact b small{font-size:20px;font-weight:600;color:var(--band-muted)}
.fact span{font-size:13px;color:var(--band-muted)}
.plates{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.plates i{display:block;width:12px;height:30px;border-radius:3px;background:currentColor}
.plates i:nth-child(odd){height:36px}

/* area */
.area{display:flex;flex-direction:column;gap:14px}
.areabar{display:flex;height:64px;border-radius:10px;overflow:hidden;gap:2px;background:var(--bg)}
.areabar div{min-width:0}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 20px}
.legend div{display:flex;align-items:baseline;gap:8px;font-size:15px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none;align-self:center}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.total{display:flex;align-items:baseline;gap:10px}
.total b{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.amen{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:32px}
.am{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.am b{font-family:var(--display);font-weight:800;font-size:32px;line-height:1}
.am h3{font-size:18px}
.am p{font-size:14px;color:var(--muted)}
.am b{overflow-wrap:anywhere}
.am ul{margin:0;padding-left:18px;font-size:15px;display:flex;flex-direction:column;gap:4px}

/* equipment */
.eq{display:flex;flex-direction:column}
.eqrow{display:grid;grid-template-columns:minmax(0,1.1fr) 90px minmax(0,1.4fr);gap:20px;align-items:center;padding-block:18px;border-top:1px solid var(--line)}
.eqrow:last-child{border-bottom:1px solid var(--line)}
.eqrow .for{font-size:14px;color:var(--muted);margin-top:4px}
.eqrow .n{font-family:var(--display);font-weight:800;font-size:52px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.eqrow .n small{display:block;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.eqrow .what{font-size:14px;color:var(--muted);margin-top:8px}
.eqrow .plates{color:var(--ink)}
.eqrow .plates i{width:9px;height:24px}
.eqrow .plates i:nth-child(odd){height:28px}
.quality{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}

/* classes */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.col{display:flex;flex-direction:column;gap:12px}
.col>h3{font-size:26px;text-transform:uppercase;display:flex;align-items:baseline;gap:10px}
.col>h3 span{font:500 14px var(--body);text-transform:none;color:var(--muted);letter-spacing:0}
.cls{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.cols>*,.find>*,.hc>*{min-width:0}
.cls h3{font-size:21px;min-width:0;overflow-wrap:break-word}
.cls .desc{grid-column:1/-1;font-size:14px;color:var(--muted)}
.cls .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:4px}
.cls .meta span b{font-weight:600}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mono{width:48px;height:48px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px}
.tm h3{font-size:22px}
.tm .role{font-size:14px;color:var(--muted)}
.tm .tags{display:flex;flex-wrap:wrap;gap:4px}
.tm .yrs{font-size:13px;color:var(--muted);margin-top:auto}
.staff{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.staff h3{font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stafflist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 24px}
.stafflist div{display:flex;justify-content:space-between;gap:10px;padding-block:10px;border-top:1px solid var(--line);font-size:15px}
.stafflist div span{color:var(--muted);text-align:right}

/* prices */
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.pg.hl{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.pg.hl .pr small,.pg.hl .pnote{color:var(--band-muted)}
.pg.hl .pr{border-color:var(--band-line)}
.pg>h3{font-size:24px;text-transform:uppercase;margin-bottom:6px}
.pr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.pr span{min-width:0}
.pr small{display:block;font-size:13px;color:var(--muted)}
.pr b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.pnote{font-size:13px;color:var(--muted);margin-top:6px}

/* find us */
.find{display:grid;grid-template-columns:1fr 1.3fr;gap:24px;align-items:stretch}
.findinfo{display:flex;flex-direction:column;gap:18px}
.faddr{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;user-select:all}
.small{font-size:13px}
.mapbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:300px;background:var(--surface2);display:flex}
.mapbox iframe{border:0;width:100%;min-height:300px;flex:1}
.mapfallback{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);padding:24px;text-align:center;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
.mapfallback svg{width:44px;height:44px;fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.mapfallback b{font-family:var(--display);font-size:24px}
.mapfallback span{font-size:13px;color:var(--muted);background:var(--surface2);padding:0 6px;border-radius:4px}
.mapfallback span:last-child{color:var(--accent);font-weight:600}

/* hours & contacts */
.hc{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.hours{width:100%;border-collapse:collapse}
.hours td{padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.hours td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hours tr.today td{color:var(--accent);font-weight:700}
.contact{display:flex;flex-direction:column;gap:16px}
.cline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cline .v{font-weight:600;font-size:20px;user-select:all}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.appbtn{flex:none}
.appbtn .sh{display:none}
footer{border-top:1px solid var(--line);padding-block:24px 40px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:9}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .herobg{background-image:linear-gradient(180deg,rgba(10,13,17,.7) 0%,rgba(10,13,17,.5) 55%,rgba(10,13,17,.3) 100%),url("img/hero.jpg")}
  .amen{grid-template-columns:1fr 1fr}
  .prices{grid-template-columns:1fr}
  .cols,.hc,.find{grid-template-columns:1fr}
}
@media (max-width:620px){
  nav.links{display:none}
  header.top .wrap{justify-content:space-between;gap:10px}
  .brand{margin-right:auto;font-size:24px;white-space:nowrap}
  .appbtn .lg{display:none}
  .appbtn .sh{display:inline}
  .eqrow{grid-template-columns:1fr auto;gap:8px 16px}
  .eqrow .viz{grid-column:1/-1}
  section{padding-block:40px}
}
@media (max-width:400px){ .amen{grid-template-columns:1fr} .fact b{font-size:34px} }
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#top">BODY GYM</a>
  <nav class="links" id="nav"></nav>
  <a class="btn primary sm appbtn" id="appBtn"></a>
  <div class="seg" id="langSeg"><button data-lang="uk">UA</button><button data-lang="ru">RU</button></div>
</div></header>

<main id="top">
  <div class="wrap"><div class="demo" id="demo"></div></div>
  <div class="herobg"><div class="wrap hero" id="hero"></div></div>
  <section id="about" class="photosec"><div class="wrap" id="aboutIn"></div></section>
  <section id="equipment"><div class="wrap" id="eqIn"></div></section>
  <section id="classes"><div class="wrap" id="clsIn"></div></section>
  <section id="team"><div class="wrap" id="teamIn"></div></section>
  <section id="prices"><div class="wrap" id="priceIn"></div></section>
  <section id="contacts"><div class="wrap" id="contIn"></div></section>
  <section id="find"><div class="wrap" id="findIn"></div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="toast" id="toast" hidden></div>

let lang='uk';
try{const s=localStorage.getItem('zal-landing-lang');if(s==='uk'||s==='ru')lang=s;}catch(e){}
const L=()=>T[lang];
const tr=x=>x==null?'':typeof x==='string'?x:(x[lang]??x.uk);
const nm=n=>lang==='ru'?(TRN[n]||n):n;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=p=>p.toLocaleString(L().loc)+' '+L().cur;
const head=(ey,h,p)=>`<div class="sec-head"><span class="eyebrow">${ey}</span><h2>${h}</h2>${p?`<p>${p}</p>`:''}</div>`;
const plates=n=>{let h='';for(let i=0;i<n;i++)h+='<i></i>';return `<div class="plates" aria-hidden="true">${h}</div>`;};
const toMin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m;};

function openState(){
  const now=new Date(),d=(now.getDay()+6)%7,m=now.getHours()*60+now.getMinutes();
  const [o,c]=C.hours[d];
  if(m>=toMin(o)&&m<toMin(c))return{open:true,txt:`${L().openNow} ${c}`};
  const next=m<toMin(o)?o:C.hours[(d+1)%7][0];
  return{open:false,txt:`${L().closedNow} ${next}`};
}

function render(){
  const l=L();
  document.documentElement.lang=lang;
  const ab=document.getElementById('appBtn');ab.href=C.appUrl;ab.innerHTML=`<span class="lg">${l.appBtn}</span><span class="sh">${l.appBtnS}</span>`;
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  document.getElementById('nav').innerHTML=Object.entries(l.nav).map(([k,v])=>`<a href="#${k}">${v}</a>`).join('');
  document.getElementById('demo').textContent=l.demo;

  const area=C.zones.reduce((s,z)=>s+z.m2,0);
  const eqN=C.equip.filter(e=>e.stat!==false).reduce((s,e)=>s+e.n,0);
  const st=openState();
  document.getElementById('hero').innerHTML=`
   <div class="hero-l"><span class="eyebrow">${l.heroEy}</span><h1>${l.heroH}</h1><p class="lead">${l.heroP}</p>
    <div class="cta"><a class="btn primary" href="#prices">${l.toPrices}</a><a class="btn" href="#contacts">${l.toTrial}</a></div></div>
   <div class="band">
    <div class="open"><span class="dot ${st.open?'on':''}"></span><span class="num">${st.txt}</span></div>
    <div class="facts">
     <div class="fact"><b class="num">${area}</b><span>${l.m2}</span></div>
     <div class="fact"><b class="num">${eqN}</b><span>${l.eq}</span></div>
     <div class="fact"><b class="num">${C.trainers.length}</b><span>${l.tr}</span></div>
     <div class="fact"><b class="num">${+C.hours[0][0].slice(0,2)}–${+C.hours[0][1].slice(0,2)}</b><span>${l.daily}</span></div>
    </div>
    ${plates(eqN)}
   </div>`;

  document.getElementById('aboutIn').innerHTML=head(l.aboutEy,l.aboutH,l.aboutP)+`
   <div class="area">
    <div class="total"><b class="num">${area}</b><span class="muted">м² · ${l.total}</span></div>
    <div class="areabar" role="img" aria-label="${esc(C.zones.map(z=>tr(z.n)+' '+z.m2+' м²').join(', '))}">${C.zones.map(z=>`<div style="flex:${z.m2};background:var(${z.c})"></div>`).join('')}</div>
    <div class="legend">${C.zones.map(z=>`<div><i style="background:var(${z.c})"></i><span>${esc(tr(z.n))}</span><b>${z.m2} м²</b></div>`).join('')}</div>
   </div>
   <div class="amen">${C.amen.map(a=>`<div class="am"><b class="num">${esc(tr(a.v))}${tr(a.u)?` <small style="font-size:18px;font-weight:600">${esc(tr(a.u))}</small>`:''}</b>${tr(a.t)?`<h3>${esc(tr(a.t))}</h3>`:''}${a.list?`<ul>${a.list.map(x=>`<li>${esc(tr(x))}</li>`).join('')}</ul>`:`<p>${esc(tr(a.d))}</p>`}</div>`).join('')}</div>`;

  document.getElementById('eqIn').innerHTML=head(l.eqEy,l.eqH,l.eqP)+`
   <div class="eq">${C.equip.map(e=>`<div class="eqrow">
     <div><h3>${esc(tr(e.t))}</h3><div class="for">${esc(tr(e.for))}</div></div>
     <div class="n num">${e.n}<small>${e.stat===false?l.places:l.units}</small></div>
     <div class="viz">${plates(e.n)}<div class="what">${esc(tr(e.w))}</div></div></div>`).join('')}</div>
   <div class="quality"><h3>${l.qT}</h3><p class="muted" style="margin-top:6px;max-width:48em">${l.qP}</p></div>`;

  const cls=(c,kid)=>`<div class="cls"><h3>${esc(tr(c.t))}</h3>${kid?`<span class="pill warn num">${c.age} ${l.age}</span>`:`<span class="pill ${c.f==='i'?'ok':''}">${c.f==='i'?l.indiv:l.group}</span>`}
    <p class="desc">${esc(tr(c.d))}</p>
    <div class="meta"><span class="num"><b>${esc(tr(c.when))}</b></span><span class="muted num">${c.dur} ${l.min}</span>${c.tr?`<span class="muted">${l.trainer}: ${esc(nm(c.tr))}</span>`:''}</div></div>`;
  document.getElementById('clsIn').innerHTML=head(l.clsEy,l.clsH,l.clsP)+`
   <div class="cols"><div class="col"><h3>${l.adults}</h3>${C.adults.map(c=>cls(c,false)).join('')}</div>
   <div class="col"><h3>${l.kids}</h3>${C.kids.map(c=>cls(c,true)).join('')}</div></div>`;

  document.getElementById('teamIn').innerHTML=head(l.teamEy,l.teamH,l.teamP)+`
   <div class="team">${C.trainers.map(t=>`<div class="tm"><div class="mono">${esc(nm(t.n)[0])}</div><div><h3>${esc(nm(t.n))}</h3><div class="role">${esc(tr(t.r))}</div></div>
    <div class="tags">${tr(t.s).map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div><div class="yrs num">${t.y} ${l.yrs}</div></div>`).join('')}</div>
   <div class="staff"><h3>${l.staffH}</h3><div class="stafflist">${C.staff.map(s=>`<div><b>${esc(nm(s.n))}</b><span>${esc(tr(s.r))}</span></div>`).join('')}</div></div>`;

  document.getElementById('priceIn').innerHTML=head(l.prEy,l.prH,l.prP)+`
   <div class="prices">${C.prices.map(g=>`<div class="pg ${g.hl?'hl':''}"><h3>${esc(tr(g.t))}</h3>
    ${g.items.map(i=>`<div class="pr"><span>${esc(tr(i.n))}${i.s?`<small>${esc(tr(i.s))}</small>`:''}</span><b>${money(i.p)}</b></div>`).join('')}
    ${g.note?`<p class="pnote">${esc(tr(g.note))}</p>`:''}</div>`).join('')}</div>`;

  const td=(new Date().getDay()+6)%7;
  document.getElementById('contIn').innerHTML=head(l.cEy,l.cH,'')+`
   <div class="hc"><div><table class="hours"><tbody>${C.hours.map((h,i)=>`<tr class="${i===td?'today':''}"><td>${l.wd[i]}${i===td?` · ${l.today}`:''}</td><td>${h[0]}–${h[1]}</td></tr>`).join('')}</tbody></table></div>
   <div class="contact">
    <div><div class="lbl">${l.phone}</div><div class="cline"><a class="v num" id="phoneV" href="tel:${C.phone.replace(/\s/g,'')}" style="color:inherit;text-decoration:none">${esc(C.phone)}</a><button class="btn sm" data-copy="phoneV">${l.copy}</button></div></div>
    <div><div class="lbl">${l.addr}</div><div class="cline"><span class="v">${esc(tr(C.addr))}</span><a class="btn sm" href="#find">${l.nav.find}</a></div></div>
    <div><div class="lbl">Instagram</div><div class="cline"><a class="v" href="https://www.instagram.com/${C.instagram}/" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none">@${esc(C.instagram)}</a></div></div>
   </div></div>`;

  const m=C.map,q=encodeURIComponent,pid=q(m.placeId);
  const dirUrl=`https://www.google.com/maps/dir/?api=1&destination=${q(m.name)}&destination_place_id=${pid}`;
  const openUrl=`https://www.google.com/maps/search/?api=1&query=${q(m.name)}&query_place_id=${pid}`;
  const embed=C.mapEmbedHosts.some(h=>location.hostname.endsWith(h));
  const coords=`${m.lat.toFixed(5)}° N, ${m.lng.toFixed(5)}° E`;
  document.getElementById('findIn').innerHTML=head(l.fEy,l.fH,l.fP)+`
   <div class="find">
    <div class="findinfo">
     <div><div class="lbl">${l.addr}</div><div class="faddr" id="addrV">${esc(tr(C.addr))}</div>
      <div class="muted small num" style="margin-top:4px">${esc(m.name)} · ${coords}</div></div>
     <div class="cta"><a class="btn primary" href="${dirUrl}" target="_blank" rel="noopener">${l.route}</a><a class="btn" href="${openUrl}" target="_blank" rel="noopener">${l.openMap}</a><button class="btn" data-copy="addrV">${l.copy}</button></div>
     <p class="muted small">${l.routeHint}</p>
    </div>
    <div class="mapbox">${embed
      ?`<iframe title="${esc(m.name)}" src="https://maps.google.com/maps?q=${q(m.name+', '+m.q)}&z=17&hl=${lang}&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`
      :`<a class="mapfallback" href="${openUrl}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><b>${esc(m.name)}</b><span class="num">${coords}</span><span>${l.openMap} →</span></a>`}</div>
   </div>`;

  document.getElementById('foot').textContent=`${C.name} · ${l.foot} · ${tr(C.addr)}`;
}

function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2000);}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('zal-landing-lang',lang);}catch(err){}render();return;}
  if(b.dataset.copy){
    const el=document.getElementById(b.dataset.copy);
    const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast(L().copyFail);};
    try{navigator.clipboard.writeText(el.textContent.trim()).then(()=>toast(L().copied),sel);}catch(err){sel();}
  }
});
render();
})();
</script>

</html>
