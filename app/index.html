*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 12px var(--body);padding:6px 9px;cursor:pointer;letter-spacing:.04em}
.seg button.on{background:var(--ink);color:var(--bg)}
.demo{font-size:12px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo button{margin-left:auto}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.btn{font:600 14px var(--body);border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
input,select,textarea{font:15px var(--body);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card{background:var(--ink);color:var(--bg);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card .plan{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.card .big{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}

.plates i{display:block;width:14px;height:34px;border-radius:3px;background:var(--bg);opacity:.95}
.plates i.used{opacity:.18}
.plates i:nth-child(odd){height:40px}
.card .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;flex-wrap:wrap}
.card .meta b{font-weight:600}
.code{display:flex;align-items:center;gap:14px}
.bars{display:flex;height:44px;gap:2px;align-items:stretch;flex:none}
.bars i{display:block;background:var(--ink)}
.memno{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.06em}

.item{display:flex;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}

.pips{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.pips i{width:8px;height:8px;border-radius:2px;background:var(--accent)}
.pips i.free{background:var(--line)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.days button{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font:500 12px var(--body)}

.days button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.news b{display:block;font-weight:600}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 8px}

.stat span{font-size:11px;color:var(--muted);letter-spacing:.03em}
.chart svg{width:100%;height:auto;display:block}
.chart .axis{fill:var(--muted);font:11px var(--body)}
.chart .gl{stroke:var(--line)}
.chart .ln{stroke:var(--accent);fill:none;stroke-width:2.5}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dt{fill:var(--accent)}
.chart .lbl{fill:var(--ink);font:600 12px var(--body)}
table.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:8px 0;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

.xbtn{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;padding:6px}

function chart(ws){
  const pts=ws.slice().reverse().map(w=>{const its=w.items.filter(i=>i.ex===ui.exSel);return its.length?{d:w.date,v:Math.max(...its.map(i=>+i.w))}:null}).filter(Boolean);
  if(pts.length<2)return `<div class="empty">${t('noData')}</div>`;
  const W=340,H=170,L=34,R=14,Tp=22,B=26;
  let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));
  const step=mx-mn>40?20:mx-mn>15?10:5;mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;if(mx===mn)mx+=step;
  const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>Tp+(H-Tp-B)*(1-(v-mn)/(mx-mn));
  let g='';for(let v=mn;v<=mx;v+=step)g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const line=pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ');
  const area=`${L},${H-B} ${line} ${x(pts.length-1)},${H-B}`;
  const last=pts[pts.length-1],first=pts[0];
  const delta=last.v-first.v;
  return `<div class="row small"><span class="muted">${t('bestW')}</span><b class="num">${Math.max(...pts.map(p=>p.v))} ${t('kg')}</b><div class="spacer"></div><span class="pill ${delta>=0?'ok':'bad'} num">${delta>=0?'+':''}${delta} ${t('kg')}</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr(EX[ui.exSel]))}">${g}<polygon class="ar" points="${area}"/><polyline class="ln" points="${line}"/>
  ${pts.map((p,i)=>`<circle class="dt" cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}"/>`).join('')}
  <text class="lbl" x="${x(pts.length-1)}" y="${y(last.v)-10}" text-anchor="end">${last.v}</text>
  <text class="axis" x="${L}" y="${H-6}">${fmt(first.d)}</text><text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${fmt(last.d)}</text></svg>`;
}

function syncRows(){ui.rows.forEach((r,i)=>{['ex','sets','reps','w'].forEach(f=>{const el=document.getElementById('r'+i+f);if(el)r[f]=el.value;});});}
const val=id=>(document.getElementById(id)?.value||'').trim();

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.lang){S.lang=b.dataset.lang;save();render();return;}
  if(b.dataset.role){S.role=b.dataset.role;ui.tab=null;save();render();window.scrollTo(0,0);return;}
  if(b.dataset.tab){ui.tab=b.dataset.tab;ui.armed=null;render();window.scrollTo(0,0);return;}
  const a=b.dataset.a;if(!a)return;
  const armed=ui.armed;ui.armed=null;
  switch(a){
  case'reset': if(armed!=='reset'){ui.armed='reset';renderChrome();return;} {const l=S.lang,r=S.role;S=seed();S.lang=l;S.role=r;save();toast(t('resetDone'));} break;
  case'day': ui.day=b.dataset.d;break;
  case'aday': ui.aday=b.dataset.d;break;
  case'book':{const key=b.dataset.k+'|'+b.dataset.d;(S.bookings[key]||(S.bookings[key]=[])).push(S.me);save();toast(t('bookedT'));break;}
  case'unbook':{const key=b.dataset.k+'|'+b.dataset.d;S.bookings[key]=(S.bookings[key]||[]).filter(x=>x!==S.me);save();toast(t('cancelT'));break;}
  case'addrow': syncRows();ui.rows.push({ex:'bench',sets:3,reps:8,w:''});break;
  case'rmrow': syncRows();ui.rows.splice(+b.dataset.i,1);break;
  case'savew':{syncRows();const items=ui.rows.filter(r=>r.w!==''&&+r.sets>0&&+r.reps>0).map(r=>({ex:r.ex,sets:+r.sets,reps:+r.reps,w:+r.w}));
    if(!items.length){toast(t('fillAll'));return;}
    const ex=S.workouts.find(w=>w.client===S.me&&w.date===TD);
    if(ex)ex.items.push(...items);else S.workouts.push({id:uid(),client:S.me,date:TD,items});
    ui.exSel=items[0].ex;ui.rows=[{ex:'squat',sets:5,reps:5,w:''}];save();toast(t('savedW'));break;}
  case'copy': try{navigator.clipboard.writeText(b.dataset.v).then(()=>toast(t('copied')),()=>{});}catch(err){} return;
  case'visit':{const c=client(b.dataset.k);if(c.visits.includes(TD))return;c.visits.unshift(TD);if(c.left!=null)c.left--;save();toast(t('visitT'));break;}
  case'sell':{const c=client(b.dataset.k),p=plan(document.getElementById('sp_'+c.id).value);c.plan=p.id;c.left=p.visits;c.until=iso(addDays(TODAY,p.days));save();toast(t('sellT'));break;}
  case'addclient':{const n=val('ncName'),ph=val('ncPhone'),p=plan(val('ncPlan'));if(!n||!ph){toast(t('fillAll'));return;}
    const no=Math.max(...S.clients.map(c=>c.no))+1;S.clients.push({id:uid(),no,name:n,phone:ph,plan:p.id,left:p.visits,until:iso(addDays(TODAY,p.days)),visits:[]});ui.q='';save();toast(t('addedC'));break;}
  case'addclass':{const title=val('kTitle'),tri=val('kTrainer'),time=val('kTime'),days=[0,1,2,3,4,5,6].filter(i=>document.getElementById('kd'+i).checked);
    if(!title||!tri||!time||!days.length){toast(t('fillAll'));return;}
    S.classes.push({id:uid(),days,time,dur:+val('kDur')||60,title,trainer:tri,cap:+val('kCap')||8});save();toast(t('addedK'));break;}
  case'delclass': if(armed!=='k'+b.dataset.k){ui.armed='k'+b.dataset.k;break;} S.classes=S.classes.filter(c=>c.id!==b.dataset.k);save();toast(t('deleted'));break;
  case'addnews':{const ti=val('nTitle'),tx=val('nText');if(!ti||!tx){toast(t('fillAll'));return;}S.news.push({id:uid(),date:TD,title:ti,text:tx});save();toast(t('published'));break;}
  case'delnews': if(armed!=='n'+b.dataset.k){ui.armed='n'+b.dataset.k;break;} S.news=S.news.filter(n=>n.id!==b.dataset.k);save();toast(t('deleted'));break;
  }
  render();
});
document.addEventListener('change',e=>{if(e.target.id==='exSel'){ui.exSel=e.target.value;syncRows();render();}});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;renderClientList();}});
render();
})();
</script>

</body></html>
